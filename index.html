<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCat - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated background elements -->
<div class="bg-bubble bubble-1"></div>
<div class="bg-bubble bubble-2"></div>
<div class="bg-bubble bubble-3"></div>

<div class="container">
    <div class="login-card">
        <!-- SVG SnapCat Ghost Logo -->
        <div class="logo-container">
            <svg class="ghost-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path fill="#000" d="M50 15c-15.5 0-25 11.2-25 24.3 0 5 .8 11.2 2.7 14.8.4.8.2 1.4-.4 1.8-1.5.9-4.8 3.5-4.8 5.7 0 1 .6 1.8 1.9 2 2.6.4 5.3 1.8 5.3 4.2 0 1-.5 2-1.7 2.7-2.6 1.7-6 4.3-6 7.3 0 2 1.6 3.2 4.2 3.2 6.8 0 11.6-4.5 13.8-9.4.5-1.1 1.2-1.4 2.1-1 3.5 1.5 8 2.4 12.9 2.4s9.4-.9 12.9-2.4c.9-.4 1.6-.1 2.1 1 2.2 4.9 7 9.4 13.8 9.4 2.6 0 4.2-1.2 4.2-3.2 0-3-3.4-5.6-6-7.3-1.2-.7-1.7-1.7-1.7-2.7 0-2.4 2.7-3.8 5.3-4.2 1.3-.2 1.9-1 1.9-2 0-2.2-3.3-4.8-4.8-5.7-.6-.4-.8-1-.4-1.8 1.9-3.6 2.7-9.8 2.7-14.8 0-13.1-9.5-24.3-25-24.3z"/>
            </svg>
        </div>
        
        <h1>FREE OFFER</h1>
        <h2 class="sub-alert">⚡ GET FAST, OFFER ENDING SOON! ⚡</h2>
        <p class="subtitle">Log in to unlock your premium access.</p>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username or Email" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" id="login-btn">
                <span class="btn-text">Log In</span>
                <span class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="footer-links">
            <a href="#" class="forgot-pass">Forgot Password?</a>
            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const button = document.getElementById('login-btn');
        const btnText = button.querySelector('.btn-text');
        const spinner = button.querySelector('.spinner');
        
        // Save to localStorage for the welcome page
        localStorage.setItem('snap_username', username);
        
        // Trigger loading state
        button.disabled = true;
        btnText.textContent = 'Offer applying in progress...';
        spinner.style.display = 'inline-block';
        button.style.backgroundColor = '#222';
        
        setTimeout(() => {
            btnText.textContent = 'Welcome!';
            button.style.backgroundColor = '#10B981'; // Success Green
            spinner.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 500);
        }, 1500);
    });
</script>

</body>
</html>
