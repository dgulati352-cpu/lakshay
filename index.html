<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCat - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated background elements -->
<div class="bg-bubble bubble-1"></div>
<div class="bg-bubble bubble-2"></div>
<div class="bg-bubble bubble-3"></div>

<div class="container">
    <div class="login-card">
        <!-- SVG SnapCat Ghost Logo -->
        <div class="logo-container">
            <svg class="ghost-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path fill="#ffffff" stroke="#000000" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" d="M256 64c-70.5 0-128 44.8-128 112 0 24.3 6.4 46.7 18.2 65.6.8 1.3.5 3-.5 4.1-9.5 10.3-27.4 22.1-42.8 24.8-10.4 1.8-17.2 10.2-16.5 20.7.8 11.5 11.3 19.8 22.8 18.9 13.9-1.1 29 5.1 33 19.9.9 3.4.1 7.1-2.4 9.7-14.5 15.6-33.5 29.7-33.5 49.8 0 17 12.5 27.5 32.4 27.5 40.8 0 65.8-31.3 79.1-51.2 1.6-2.4 4.7-3.3 7.3-2.2 26.3 11.4 56.4 17.8 88.4 17.8s62.1-6.4 88.4-17.8c2.6-1.1 5.7-.2 7.3 2.2 13.3 19.9 38.3 51.2 79.1 51.2 19.9 0 32.4-10.5 32.4-27.5 0-20.1-19-34.2-33.5-49.8-2.4-2.6-3.2-6.3-2.4-9.7 4-14.8 19.1-21 33-19.9 11.5.9 22-7.4 22.8-18.9.7-10.5-6.1-18.9-16.5-20.7-15.4-2.7-33.3-14.5-42.8-24.8-1-1.1-1.3-2.8-.5-4.1 11.8-18.9 18.2-41.3 18.2-65.6C384 108.8 326.5 64 256 64z"/>
            </svg>
        </div>
        
        <h1>FREE OFFER</h1>
        <h2 class="sub-alert">⚡ GET FAST, OFFER ENDING SOON! ⚡</h2>
        <p class="subtitle">Log in to unlock your premium access.</p>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username or Email" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" id="login-btn">
                <span class="btn-text">Log In</span>
                <span class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="footer-links">
            <a href="#" class="forgot-pass">Forgot Password?</a>
            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const button = document.getElementById('login-btn');
        const btnText = button.querySelector('.btn-text');
        const spinner = button.querySelector('.spinner');
        
        // Save to localStorage for the welcome page
        localStorage.setItem('snap_username', username);
        
        // Trigger loading state
        button.disabled = true;
        btnText.textContent = 'Offer applying in progress...';
        spinner.style.display = 'inline-block';
        button.style.backgroundColor = '#222';
        
        setTimeout(() => {
            btnText.textContent = 'Welcome!';
            button.style.backgroundColor = '#10B981'; // Success Green
            spinner.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 500);
        }, 1500);
    });
</script>

</body>
</html>
