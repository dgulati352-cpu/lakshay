<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCat - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Snapchat Logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated background elements -->
<div class="bg-bubble bubble-1"></div>
<div class="bg-bubble bubble-2"></div>
<div class="bg-bubble bubble-3"></div>

<div class="container">
    <div class="login-card">
        <!-- Official Snapchat Logo -->
        <div class="logo-container">
            <i class="fa-brands fa-snapchat ghost-logo-icon"></i>
        </div>
        
        <h1>FREE OFFER</h1>
        <h2 class="sub-alert">⚡ GET FAST, OFFER ENDING SOON! ⚡</h2>
        <p class="subtitle">Log in to unlock your premium access.</p>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username or Display Name" required autocomplete="username">
            </div>

            <button type="submit" id="login-btn">
                <span class="btn-text">Continue</span>
                <span class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="footer-links">
            <p class="signup">
                Enter your username to explore the dashboard.
            </p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAiWYiZ9a-SBQaj6tHJfTGXIaEFPyEdzQw",
      authDomain: "snapchat-26b05.firebaseapp.com",
      projectId: "snapchat-26b05",
      storageBucket: "snapchat-26b05.firebasestorage.app",
      messagingSenderId: "284342142379",
      appId: "1:284342142379:web:1a39378d955f679012beee",
      measurementId: "G-3CRGH8SS23"
    };

    // Initialize Firebase Analytics only
    const app = initializeApp(firebaseConfig);
    let analytics;
    try {
        analytics = getAnalytics(app);
    } catch(e) {}

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const button = document.getElementById('login-btn');
        const btnText = button.querySelector('.btn-text');
        const spinner = button.querySelector('.spinner');
        
        // Save display name for local demo session
        localStorage.setItem('snap_username', username);

        if (analytics) {
            try {
                logEvent(analytics, 'select_content', { content_type: 'username_submitted' });
            } catch (err) {}
        }
        
        // Trigger loading state
        button.disabled = true;
        btnText.textContent = 'Offer applying in progress...';
        spinner.style.display = 'inline-block';
        button.style.backgroundColor = '#222';
        
        setTimeout(() => {
            btnText.textContent = 'Welcome!';
            button.style.backgroundColor = '#10B981'; // Success Green
            spinner.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 500);
        }, 1500);
    });
</script>

</body>
</html>
