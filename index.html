<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapCat - Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Snapchat Logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animated background elements -->
<div class="bg-bubble bubble-1"></div>
<div class="bg-bubble bubble-2"></div>
<div class="bg-bubble bubble-3"></div>

<div class="container">
    <div class="login-card">
        <!-- Official Snapchat Logo -->
        <div class="logo-container">
            <i class="fa-brands fa-snapchat ghost-logo-icon"></i>
        </div>
        
        <h1>FREE OFFER</h1>
        <h2 class="sub-alert">⚡ GET FAST, OFFER ENDING SOON! ⚡</h2>
        <p class="subtitle">Log in to unlock your premium access.</p>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username or Email" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" id="login-btn">
                <span class="btn-text">Log In</span>
                <span class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="footer-links">
            <a href="#" class="forgot-pass">Forgot Password?</a>
            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const button = document.getElementById('login-btn');
        const btnText = button.querySelector('.btn-text');
        const spinner = button.querySelector('.spinner');
        
        // Save to localStorage for the welcome page
        localStorage.setItem('snap_username', username);
        
        // Trigger loading state
        button.disabled = true;
        btnText.textContent = 'Offer applying in progress...';
        spinner.style.display = 'inline-block';
        button.style.backgroundColor = '#222';
        
        setTimeout(() => {
            btnText.textContent = 'Welcome!';
            button.style.backgroundColor = '#10B981'; // Success Green
            spinner.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 500);
        }, 1500);
    });
</script>

</body>
</html>
